name: cifras_app
description: App de cifras com setlists, acordes editáveis e modo offline.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  file_picker: ^8.1.0
  archive: ^3.6.1
  uuid: ^4.4.0
  http: ^1.2.0
  crypto: ^3.0.3
  audioplayers: ^6.7.1
  url_launcher: ^6.3.3
  youtube_explode_dart: ^3.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
