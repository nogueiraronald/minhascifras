name: cifras_app
description: App de cifras com setlists, acordes editáveis e modo offline.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  file_picker: ^8.1.0
  archive: ^3.6.1
  uuid: ^4.4.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
